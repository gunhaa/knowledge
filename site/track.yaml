# 첫 화면 맨 위에 두는 학습 트랙
#
# 지금 집중하는 주제의 세트를 읽는 순서대로 적는다. 여기 적은 세트는 아래 대주제 표에서 빠지고 트랙에만 보인다.
# 주제가 바뀌면 이 파일만 바꾼다. 문서 경로·대주제는 그대로다.
